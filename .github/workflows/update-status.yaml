name: Update stats

on:
  schedule:
    # Runs at 12am UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          version: lts/*
          cache: 'yarn'

      - name: Install pug
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Compile README
        run: yarn pug templates/README.pug -E md -o .

      - name: Repopulate PR stats region
        uses: Skitionek/github-pr-stats@main
        with:
          username: Skitionek
          file: README.md
          commit_changes: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: repo-aggregate
          theme: dark
          status: all
          min_stars: 0
          limit: 5
          sort: stars_desc,merged_desc
          stats: total_pr,repos_with_merged_pr,showing_repos
          fields: repo,stars,pr_numbers

      - uses: stefanzweifel/git-auto-commit-action@v5
